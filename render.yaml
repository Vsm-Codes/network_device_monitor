services:
  - type: web
    name: network-device-monitor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT "app:create_app()"
    healthCheckPath: /health
    envVars:
      - key: READ_ONLY
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.3"
